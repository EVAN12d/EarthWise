<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarthWise | Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

body {
    background-color: #edf7f5;
    color: #245350;
    font-family: 'DM Sans', sans-serif;
}
.reset {
    background-color: white;
    border: 1px solid #e1eae5;
    border-radius: 20px;
    padding: 45px 35px;
    box-shadow: 0 12px 36px rgba(44,96,91,0.055);
}
.reset-icon {
    width: 60px;
    height: 60px;
    background-color: white;
    color: #2d8a76;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 25px;
}
h1 {
    font-family: 'Manrope', sans-serif;
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 12px;
}
.reset > p {
    color: #72918c;
    font-size: 15px;
    line-height: 1.7;
}
form {
    margin-top: 30px;
}
label {
    display: block;
    font-weight: 700;
    margin-bottom: 10px;
}
.form-control {
    padding: 14px;
    border: 1px solid #dce9e5;
    border-radius: 10px;
    font-size: 15px;
}
.form-control:focus {
    border-color: #2d8a76;
    box-shadow: none;
}
.reset-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background-color: #2d8a76;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
.reset-btn:hover {
    background-color: #176b5b;
}
.reset-btn i {
    margin-left: 8px;
}
.success-message {
    display: none;
    align-items: flex-start;
    gap: 10px;
    background-color: #edf7f5;
    color: #245350;
    border-radius: 10px;
    padding: 15px;
    margin-top: 20px;
    font-size: 14px;
}
.success-message i {
    color: #2d8a76;
    font-size: 20px;
}
.backlink {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #2d8a76;
    text-decoration: none;
    font-weight: 700;
}
.backlink:hover {
    text-decoration: underline;
}
.bottom-text {
    text-align: center;
    margin-top: 25px;
    margin-bottom: 0;
    font-size: 13px;
    font-weight: 700;
    color: #2d8a76;
}
@media (max-width: 576px) {
    .reset {
        padding: 30px 22px;
    }
    h1 {
        font-size: 27px;
    }
}
</style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-5 col-md-8">
                <div class="reset">
                    <div class="reset-icon">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <h1>Forgot Password?</h1>
                    <p>Enter your email address below to request a password reset link.</p>
                    <form id="resetForm">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                        <button type="submit" class="reset-btn">Send Reset Link <i class="bi bi-arrow-right"></i></button>
                    </form>
                    <div class="success-message" id="Success-Message">
                        <i class="bi bi-check-circle"></i>
                        <span>Request received! We have sent to your email. Password recovery is in progresss</span>
                    </div>
                    <a href="login.html" class="backlink"><i class="bi bi-arrow-left"></i>Go back to Log In</a>
                    <p class="bottom-text">Learn. Prepare. Stay Safe.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById("resetForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("Success-Message").style.display = "flex";
        });
    </script>
</body>
</html>
